name: Build Project Sierra Android APK

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node and Capacitor Dependencies
        run: |
          if [ -f package.json ]; then
            echo "package.json detected. Installing full project dependencies..."
            if [ -f package-lock.json ]; then
              npm ci || npm install
            else
              npm install
            fi
          else
            echo "package.json not present at root. Installing Capacitor Android dependencies for Gradle build..."
            npm install --no-package-lock --no-save \
              @capacitor/core@^8.5.3 \
              @capacitor/android@^8.5.3 \
              @capacitor-community/speech-recognition@^7.0.1
          fi

      - name: Decode Debug Keystore
        run: |
          if [ -f android/app/debug.keystore.base64 ]; then
            base64 -d android/app/debug.keystore.base64 > android/app/debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > android/app/debug.keystore
          fi

      - name: Run Lint and Unit Tests
        run: |
          if [ -f package.json ]; then
            npm run lint --if-present
            npm test --if-present
          else
            echo "Skipping lint and unit tests (package.json not present in repository)."
          fi

      - name: Build Frontend Production Assets
        run: |
          if [ -f package.json ] && [ -d src ]; then
            echo "Building web assets from source..."
            npm run build
          else
            echo "Using pre-bundled web assets from android/app/src/main/assets/public"
          fi

      - name: Sync Web Assets to Android Project
        run: |
          if [ -f package.json ] && [ -d src ] && { [ -f capacitor.config.ts ] || [ -f capacitor.config.json ]; }; then
            echo "Syncing compiled web assets into Android project..."
            npx cap sync android
          else
            echo "Skipping cap sync (retaining existing android assets)."
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools'

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew || true
          if [ -f gradlew ]; then
            chmod +x gradlew || true
          fi

      - name: Build Environment Diagnostics
        working-directory: android
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          echo "=== Gradle Version ==="
          ./gradlew --version
          echo "=== Android SDK Root ==="
          echo "$ANDROID_HOME"
          echo "=== Installed Android Platforms ==="
          ls -la "$ANDROID_HOME/platforms" || true
          echo "=== Installed Android Build Tools ==="
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Verify Generated APK
        run: |
          echo "=== Inspecting Generated Build Outputs ==="
          find android/ -name "*.apk" -ls || true
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            DISCOVERED_APK=$(find android/ -name "*.apk" | head -n 1)
            if [ -n "$DISCOVERED_APK" ] && [ -f "$DISCOVERED_APK" ]; then
              echo "Discovered APK at $DISCOVERED_APK. Copying to canonical path $APK_PATH..."
              mkdir -p android/app/build/outputs/apk/debug
              cp "$DISCOVERED_APK" "$APK_PATH"
            else
              echo "ERROR: Expected APK not found at $APK_PATH"
              find android/app/build/outputs/ -type f 2>/dev/null || true
              exit 1
            fi
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: Generated APK is empty (size: $APK_SIZE bytes)"
            exit 1
          fi
          echo "SUCCESS: Verified APK exists at $APK_PATH (size: $APK_SIZE bytes)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-mega-agent-v2.2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
